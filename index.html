<title>Cuenta Conmigo — Prototipo</title>
<style>
  :root{
    --bg:#f4f4f2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#131211; }
  }
  :root[data-theme="dark"]{ --bg:#131211; }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:1400px;
    aspect-ratio:1967/1043;
  }
  .stage img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    border-radius:999px;
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .hotspot:focus-visible{
    outline:2px solid #3d7bd9;
    outline-offset:3px;
  }
  .hotspot:hover{
    background:rgba(253,218,36,.18);
  }
</style>

  // Cada pantalla: imagen + lista de hotspots (rectángulo en % del frame + a qué pantalla lleva).
  var SCREENS = {
    home1: {
      image: 'home1',
      alt: "Bienvenido a Cuenta Conmigo — pantalla de inicio de Bancolombia",
      hotspots: [
        { x: 56.25, y: 85.96, w: 7.6, h: 3.4, goto: 'saraDim', label: 'Llama a Sara' }
      ]
    },
    saraDim: {
      image: 'saraDim',
      alt: "La pantalla se oscurece — Sara se está activando",
      hotspots: []
    }
  };

  var stage = document.getElementById('stage');
  var screenImg = document.getElementById('screen');
  var hotspotEls = [];

  function clearHotspots(){
    hotspotEls.forEach(function(el){ el.remove(); });
    hotspotEls = [];
  }

  function renderScreen(key){
    var def = SCREENS[key];
    screenImg.src = IMAGES[def.image];
    screenImg.alt = def.alt;
    clearHotspots();
    def.hotspots.forEach(function(h){
      var btn = document.createElement('button');
      btn.className = 'hotspot';
      btn.style.left = h.x + '%';
      btn.style.top = h.y + '%';
      btn.style.width = h.w + '%';
      btn.style.height = h.h + '%';
      btn.setAttribute('aria-label', h.label || 'Continuar');
      btn.addEventListener('click', function(){ renderScreen(h.goto); });
      stage.appendChild(btn);
      hotspotEls.push(btn);
    });
  }

  renderScreen('home1');
})();

<title>Cuenta Conmigo — Prototipo</title>
<style>
  :root{
    --bg:#f4f4f2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#131211; }
  }
  :root[data-theme="dark"]{ --bg:#131211; }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:1400px;
    aspect-ratio:1967/1043;
  }
  .stage img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    transition:opacity .22s ease;
  }
  .stage img.is-fading{ opacity:0; }

  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    border-radius:999px;
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .hotspot:focus-visible{
    outline:2px solid #3d7bd9;
    outline-offset:3px;
  }
  .hotspot[data-kind="nav"]:hover{
    background:rgba(253,218,36,.18);
  }

  /* Ícono de micrófono que se reemplaza mientras se mantiene presionado */
  .mic-active{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12%;
    opacity:0;
    transform:scale(.85);
    transition:opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .mic-active::before{
    content:"";
    position:absolute;
    inset:-22%;
    border-radius:50%;
    box-shadow:0 0 0 0 rgba(253,218,36,.55);
  }
  .hotspot.is-pressed .mic-active{
    opacity:1;
    transform:scale(1);
  }
  .hotspot.is-pressed .mic-active::before{
    animation:mic-pulse 1s ease-out infinite;
  }
  .mic-active i{
    display:block;
    width:14%;
    background:#2c2a29;
    border-radius:2px;
    animation:mic-bar 0.9s ease-in-out infinite;
  }
  .mic-active i:nth-child(1){ height:35%; animation-delay:-0.6s; }
  .mic-active i:nth-child(2){ height:70%; animation-delay:-0.3s; }
  .mic-active i:nth-child(3){ height:50%; animation-delay:-0.9s; }
  .mic-active i:nth-child(4){ height:80%; animation-delay:-0.15s; }
  @keyframes mic-bar{
    0%, 100%{ transform:scaleY(.4); }
    50%{ transform:scaleY(1); }
  }
  @keyframes mic-pulse{
    0%{ box-shadow:0 0 0 0 rgba(253,218,36,.5); }
    100%{ box-shadow:0 0 0 14px rgba(253,218,36,0); }
  }
  @media (prefers-reduced-motion: reduce){
    .stage img{ transition:none; }
    .mic-active i, .hotspot.is-pressed .mic-active::before{ animation:none; }
  }
</style>

<div class="stage" id="stage">
  <img id="screen" alt="" draggable="false" />
</div>

  // Cada pantalla: imagen + hotspots.
  // hotspot type "nav"   → al hacer click, salta a otra pantalla (goto).
  // hotspot type "press" → mientras se mantiene presionado muestra un
  //                        overlay (ícono "escuchando"); al soltar, vuelve
  //                        a como estaba. No navega a ningún lado (todavía).
  var SCREENS = {
    home1: {
      image: 'home1',
      alt: "Bienvenido a Cuenta Conmigo — pantalla de inicio de Bancolombia",
      hotspots: [
        { type:'nav', x: 56.25, y: 85.96, w: 7.6, h: 3.4, goto: 'saraDim', label: 'Llama a Sara' }
      ]
    },
    saraDim: {
      image: 'saraDim',
      alt: "La pantalla se oscurece — Sara se está activando",
      hotspots: [],
      autoAdvance: { to: 'listenPrompt', delay: 900 }
    },
    listenPrompt: {
      image: 'listenPrompt',
      alt: "Es tu turno, presiona para hablar",
      hotspots: [
        { type:'press', x: 50.06, y: 82.9, w: 3.6, h: 6.8, label: 'Mantén presionado para hablar' }
      ]
    }
  };

  var stage = document.getElementById('stage');
  var screenImg = document.getElementById('screen');
  var hotspotEls = [];
  var current = null;
  var autoAdvanceTimer = null;

  function clearHotspots(){
    hotspotEls.forEach(function(el){ el.remove(); });
    hotspotEls = [];
  }

  function buildHotspot(h){
    var btn = document.createElement('button');
    btn.className = 'hotspot';
    btn.dataset.kind = h.type;
    btn.style.left = h.x + '%';
    btn.style.top = h.y + '%';
    btn.style.width = h.w + '%';
    btn.style.height = h.h + '%';
    btn.setAttribute('aria-label', h.label || 'Continuar');

    if (h.type === 'nav'){
      btn.addEventListener('click', function(){ renderScreen(h.goto); });
    } else if (h.type === 'press'){
      var overlay = document.createElement('span');
      overlay.className = 'mic-active';
      overlay.innerHTML = '<i></i><i></i><i></i><i></i>';
      btn.appendChild(overlay);

      var press = function(e){
        e.preventDefault();
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
        btn.classList.add('is-pressed');
      };
      var release = function(){ btn.classList.remove('is-pressed'); };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('pointerleave', function(){
        if (btn.classList.contains('is-pressed')) release();
      });
    }
    return btn;
  }

  function renderScreen(key){
    if (key === current) return;
    clearTimeout(autoAdvanceTimer);
    var def = SCREENS[key];
    screenImg.classList.add('is-fading');
    setTimeout(function(){
      screenImg.src = IMAGES[def.image];
      screenImg.alt = def.alt;
      clearHotspots();
      def.hotspots.forEach(function(h){
        var el = buildHotspot(h);
        stage.appendChild(el);
        hotspotEls.push(el);
      });
      requestAnimationFrame(function(){
        screenImg.classList.remove('is-fading');
      });
      current = key;
      if (def.autoAdvance){
        autoAdvanceTimer = setTimeout(function(){
          renderScreen(def.autoAdvance.to);
        }, def.autoAdvance.delay);
      }
    }, 220);
  }

  renderScreen('home1');
  window.__goto = renderScreen; // atajo para saltar de pantalla mientras probamos
})();
